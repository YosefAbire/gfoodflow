[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gamofoodflow-backend"
version = "0.1.0"
description = "Production-grade Agricultural and Food-Security Intelligence Platform Backend"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "GamoFoodFlow Team" }
]

dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.1",
    "asyncpg>=0.29.0",
    "geoalchemy2>=0.15.0",
    "redis>=5.0.4",
    "celery>=5.4.0",
    "httpx>=0.27.0",
    "passlib[argon2]>=1.7.4",
    "python-jose[cryptography]>=3.3.0",
    "geopandas>=0.14.4",
    "shapely>=2.0.4",
    "pyproj>=3.6.1",
    "numpy>=1.26.4",
    "pandas>=2.2.2",
    "scikit-learn>=1.5.0",
    "langchain>=0.2.0",
    "langchain-core>=0.2.0",
    "langgraph>=0.0.50",
    "langchain-google-genai>=1.0.5",
    "pgvector>=0.2.5",
    "python-multipart>=0.0.9",
    "email-validator>=2.1.0",
    "argon2-cffi>=23.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.4",
    "black>=24.4.2",
    "mypy>=1.10.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "B", "I", "N", "UP", "PL", "RUF"]
ignore = ["E501", "PLR2004", "B008", "N818", "PLW0603", "PLW0602", "E712", "PLR0913", "PLR0917", "N815"]

[tool.black]
line-length = 100
target-version = ['py312']

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
